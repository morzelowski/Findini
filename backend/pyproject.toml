[project]
name = "findini-api"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",   # assert w testach i niezmiennikach
  "S311",   # random w testach
  "S608",   # SQL budowany z białej listy fragmentów, wartości zawsze jako parametry
  "B008",   # FastAPI Depends w argumentach domyślnych
  "RUF001", "RUF002", "RUF003",  # polskie znaki typograficzne w tekstach
  "S105", "S106",  # stałe testowe
  "S104",
  "SIM102", "SIM105", "SIM108",  # styl — czytelność warunków ponad zwięzłość
  "RUF046", "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S"]
"app/routers/misc.py" = ["E501"]  # szablony HTML

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
